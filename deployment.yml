apiVersion: apps/v1
kind: Deployment # Kubernetes resource kind we are creating
metadata:
  name: spring-security-jwt
spec:
  selector:
    matchLabels:
      app: spring-security-jwt
  replicas: 1 # Number of replicas that will be created for this deployment
  template:
    metadata:
      labels:
        app: spring-security-jwt
    spec:
      containers:
        - name: spring-security-jwt
          image: pritiswami123/withdatabase # Image that will be used to containers in the cluster
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080 # The port that the container is running on in the cluster


---

apiVersion: v1 # Kubernetes API version
kind: Service # Kubernetes resource kind we are creating
metadata: # Metadata of the resource kind we are creating
  name: spring-security-jwt-k8ssvc
spec:
  selector:
    app: spring-security-jwt
  ports:
    - protocol: "TCP"
      port: 4545 # The port that the service is running on in the cluster
      targetPort: 4545 # The port exposed by the service
  type: NodePort # type of the service.